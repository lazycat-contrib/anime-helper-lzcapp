application:
  subdomain: animehelper
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://animehelper:3000/
services:
  animehelper:
    # upstream: zhouc1230/anime-helper:latest@sha256:82d1590a90cedd2dbe5faf30bc0167dcd10b9e1f3fa90e6be9ce7dd55106e8ea
    # digest pin 使用 amd64 平台级 digest（Action 的 mirror 校验按 target_arch 解析 index 后比较平台 digest）
    image: docker.1ms.run/zhouc1230/anime-helper:latest@sha256:82d1590a90cedd2dbe5faf30bc0167dcd10b9e1f3fa90e6be9ce7dd55106e8ea
    binds:
      - /lzcapp/var/db:/app/db
