version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/anime-helper.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: animehelper
    # 上游只有 mutable latest tag，无法解析版本号 → digest 变化即 patch bump
    bump: patch

build:
  run_buildscript: false

images:
  # 上游仅有 latest（mutable）→ custom/created 通道 + digest 匹配；manifest 引用 digest-pinned
  - id: animehelper
    target: service
    service: animehelper
    source: zhouc1230/anime-helper
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Anime Helper
    summary: "自动追番/下载工具，使用Docker部署，支持qBittorrent和Aria下载"
